name: collect

# Runs every 6 hours. Each job collects into the runner and moves files to Google Drive with rclone
# as it goes. Uploads happen only when repo variable LIVE is "true"; otherwise it is a dry run.
# This repository is public: logs print counts only.

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      public_sources:
        description: "public sources (comma list, empty = skip)"
        default: "kev,nvd,attack,nist,fixed,knowledge,nistpubs,records,cicids2018,itdocs,eol,techdocs,wikipedia,books,videos,stackexchange,kaggle,ghrepos,notebooks,apps,zenodo,opendata"
      company:
        description: "build the fictional company"
        type: boolean
        default: true
      months:
        description: "company months per run"
        default: "40"
      scale:
        description: "company size (fixed once history starts)"
        default: "3"
      detail:
        description: "telemetry density"
        default: "1"
      minutes:
        description: "time budget per job (minutes)"
        default: "320"
      dry_run:
        description: "force a dry run (no upload)"
        type: boolean
        default: false

env:
  REMOTE: "pax:Security & IT Operations Research"
  PYTHONUNBUFFERED: "1"

jobs:
  public:
    if: github.event_name == 'schedule' || inputs.public_sources != ''
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          # slow multi-GB sources each get their own runner so they can't hold up the rest
          - group: zenodo
            sources: zenodo
          - group: kaggle
            sources: kaggle
          - group: library
            sources: wikipedia,books,videos,nistpubs,knowledge
          - group: tech
            sources: records,cicids2018,itdocs,eol,techdocs,stackexchange,ghrepos,notebooks,apps
          - group: feeds
            sources: kev,nvd,attack,nist,fixed,opendata
    concurrency: public-${{ matrix.group }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: ./.github/actions/rclone
        with:
          conf: ${{ secrets.RCLONE_CONF }}
      - name: Collect
        timeout-minutes: 320
        env:
          LIVE: ${{ vars.LIVE == 'true' && inputs.dry_run != true }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          STATE_SEED: state/public.json
          ALLOWED: ${{ inputs.public_sources || 'kev,nvd,attack,nist,fixed,knowledge,nistpubs,records,cicids2018,itdocs,eol,techdocs,wikipedia,books,videos,stackexchange,kaggle,ghrepos,notebooks,apps,zenodo,opendata' }}
        run: |
          # keep only this group's sources that the dispatch asked for
          SOURCES=$(python3 -c "import os;a=set(os.environ['ALLOWED'].split(','));print(','.join(x for x in '${{ matrix.sources }}'.split(',') if x in a))")
          if [ -z "$SOURCES" ]; then echo "nothing to do for this group"; exit 0; fi
          budget=$(cat budget.txt)
          flag=$([ "$LIVE" = "true" ] && echo --live || echo "")
          python -m collector --sources "$SOURCES" --state state/public-${{ matrix.group }}.json --budget-gb "$budget" --minutes "${{ inputs.minutes || 300 }}" $flag

      - name: Ship leftovers
        if: always() && vars.LIVE == 'true' && inputs.dry_run != true
        run: |
          R="${REMOTE:-pax:Security & IT Operations Research}"
          if [ -d out ] && [ -n "$(ls -A out 2>/dev/null)" ]; then
            rclone move out "$R" --transfers 4 --drive-chunk-size 64M --retries 5 --delete-empty-src-dirs -q || true
          fi
          f=state/public-${{ matrix.group }}.json
          [ -f $f ] && rclone copyto $f "$R/_state/public-${{ matrix.group }}.json" -q || true

  company:
    if: github.event_name == 'schedule' || inputs.company
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency: company
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: ./.github/actions/rclone
        with:
          conf: ${{ secrets.RCLONE_CONF }}
      - name: Build fictional company
        timeout-minutes: 320
        env:
          LIVE: ${{ vars.LIVE == 'true' && inputs.dry_run != true }}
        run: |
          budget=$(cat budget.txt)
          flag=$([ "$LIVE" = "true" ] && echo --live || echo "--months 2")
          python -m collector --sources company --state state/company.json --budget-gb "$budget" --minutes "${{ inputs.minutes || 300 }}" \
            --months "${{ inputs.months || '40' }}" --scale "${{ inputs.scale || '3' }}" \
            --detail "${{ inputs.detail || '1' }}" $flag

      - name: Ship leftovers
        if: always() && vars.LIVE == 'true' && inputs.dry_run != true
        run: |
          R="${REMOTE:-pax:Security & IT Operations Research}"
          if [ -d out ] && [ -n "$(ls -A out 2>/dev/null)" ]; then
            rclone move out "$R" --transfers 4 --drive-chunk-size 64M --retries 5 --delete-empty-src-dirs -q || true
          fi
          [ -f state/company.json ] && rclone copyto state/company.json "$R/_state/company.json" -q || true
